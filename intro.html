<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Junior Tickets</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000; /* Black */
      color: #d4af37; /* gold */
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .logo {
      width: 300px;
      margin-bottom: 20px;
    }

    .description {
      max-width: 400px;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    button {
      background-color: #d4af37;
      color: #1e1e1e;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="logo-main.png" alt="Junior Tickets Logo" class="logo" />
  <div class="description">
    <p>
      <strong>Junior Tickets</strong> is a recognition system where players earn 🎟️ for honorable conduct, clutch moments, and team-focused play. Submit your actions and climb the leaderboard with your squad!
    </p>
  </div>
  <button onclick="location.href='index.html'">OK</button>
</body>
</html>
